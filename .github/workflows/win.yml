name: Windows.

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '!docs/building-win*.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/win.yml'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/Telegram/**'
      - 'Telegram/configure.sh'
      - 'Telegram/Telegram.plist'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '!docs/building-win*.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/win.yml'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/Telegram/**'
      - 'Telegram/configure.sh'
      - 'Telegram/Telegram.plist'

jobs:

  windows:
    name: Windows
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-latest' }}

    strategy:
      matrix:
        arch: [x64]
        qt: [""]
        generator: ["Ninja Multi-Config"]

    env:
      UPLOAD_ARTIFACT: "true"
      ONLY_CACHE: "false"
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries${{ matrix.arch == 'x64' && '\win64' || '' }}>>%GITHUB_ENV%

      - name: Configure sccache environment.
        run: |
          if not exist %userprofile%\TBuild\sccache mkdir %userprofile%\TBuild\sccache
          echo SCCACHE_DIR=%userprofile%\TBuild\sccache>>%GITHUB_ENV%
          echo SCCACHE_CACHE_SIZE=10G>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: Restore source mtimes from git history.
        shell: bash
        working-directory: ${{ env.TBUILD }}/${{ env.REPO_NAME }}
        run: |
          python - <<'PY'
          import os
          import subprocess

          def ensure_full_history(repo):
              try:
                  shallow = subprocess.check_output(
                      ['git', '-C', repo, 'rev-parse', '--is-shallow-repository'],
                      text=True,
                      encoding='utf-8',
                      errors='replace'
                  ).strip()
              except subprocess.CalledProcessError:
                  return
              if shallow != 'true':
                  return
              # Try to unshallow; fall back to a deep fetch if needed.
              subprocess.call(['git', '-C', repo, 'fetch', '--unshallow'])
              try:
                  shallow = subprocess.check_output(
                      ['git', '-C', repo, 'rev-parse', '--is-shallow-repository'],
                      text=True,
                      encoding='utf-8',
                      errors='replace'
                  ).strip()
              except subprocess.CalledProcessError:
                  return
              if shallow == 'true':
                  subprocess.call(['git', '-C', repo, 'fetch', '--depth', '100000'])

          def restore(repo):
              # Build a set of tracked files for quick lookup.
              try:
                  files = subprocess.check_output(
                      ['git', '-C', repo, 'ls-files', '-z'],
                      text=False
                  ).split(b'\0')
              except subprocess.CalledProcessError:
                  return
              remaining = {f.decode('utf-8', 'replace') for f in files if f}
              if not remaining:
                  return

              # Walk history newest->oldest and set mtime on first sighting.
              proc = subprocess.Popen(
                  ['git', '-C', repo, 'log', '--name-only', '--pretty=format:%ct'],
                  stdout=subprocess.PIPE,
                  text=True,
                  encoding='utf-8',
                  errors='replace'
              )
              ts = None
              for line in proc.stdout:
                  line = line.strip()
                  if not line:
                      continue
                  if line.isdigit():
                      ts = int(line)
                      continue
                  if ts is None:
                      continue
                  path = line
                  if path in remaining:
                      full = os.path.join(repo, path)
                      try:
                          os.utime(full, (ts, ts))
                      except FileNotFoundError:
                          pass
                      remaining.remove(path)
                      if not remaining:
                          proc.kill()
                          break
              proc.wait()

          root = os.getcwd()
          ensure_full_history(root)
          restore(root)

          try:
              sm = subprocess.check_output(
                  ['git', '-C', root, 'submodule', 'status', '--recursive'],
                  text=True,
                  encoding='utf-8',
                  errors='replace'
              )
              for line in sm.splitlines():
                  parts = line.strip().split()
                  if len(parts) >= 2:
                      rel = parts[1]
                      path = os.path.normpath(os.path.join(root, rel))
                      ensure_full_history(path)
                      restore(path)
          except subprocess.CalledProcessError:
              pass
          PY

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          [ "${{ matrix.arch }}" = x64 ] && DOCPATH=$TBUILD/$REPO_NAME/docs/building-win-x64.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          echo "Configurate git for cherry-picks."
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - uses: ilammy/msvc-dev-cmd@v1.13.0
        name: Native Tools Command Prompt.
        with:
          arch: ${{ matrix.arch }}
          sdk: ${{ env.SDK }}

      - name: Install sccache.
        run: |
          where sccache >nul 2>nul
          if %errorlevel% neq 0 (
            winget install -e --id Mozilla.sccache --accept-source-agreements --accept-package-agreements
            copy %LOCALAPPDATA%\Microsoft\WinGet\Links\sccache.exe %LOCALAPPDATA%\
            echo %LOCALAPPDATA%>>%GITHUB_PATH%
            set "PATH=%PATH%;%LOCALAPPDATA%"
          )
          
          for /f "delims=" %%i in ('where sccache') do echo SCCACHE_EXE=%%i>>%GITHUB_ENV%
          sccache --version

      - name: Install Ninja.
        run: |
          where ninja >nul 2>nul
          if %errorlevel% neq 0 (
            winget install -e --id Ninja-build.Ninja --accept-source-agreements --accept-package-agreements
            copy %LOCALAPPDATA%\Microsoft\WinGet\Links\ninja.exe %LOCALAPPDATA%\
            echo %LOCALAPPDATA%>>%GITHUB_PATH%
            set "PATH=%PATH%;%LOCALAPPDATA%"
          )
          ninja --version

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache@v5
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-libs-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ matrix.arch }}-libs-

      - name: Qt cache.
        id: cache-qt
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-${{ matrix.qt || 'qt' }}-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ matrix.arch }}-${{ matrix.qt || 'qt' }}-

      - name: sccache cache.
        id: cache-sccache
        uses: actions/cache@v5
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: ${{ runner.OS }}-${{ matrix.arch }}-sccache-${{ github.run_id }}
          restore-keys: ${{ runner.OS }}-${{ matrix.arch }}-sccache-

      - name: Start sccache server.
        run: |
          sccache --start-server
          sccache --zero-stats

      - name: Libraries.
        env:
          GYP_MSVS_OVERRIDE_PATH: 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\'
          GYP_MSVS_VERSION: 2022
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent ${{ matrix.qt }}

      - name: Read configuration matrix.
        shell: bash
        run: |
          ARTIFACT_NAME="Telegram"

          ARCH=""
          if [ -n "${{ matrix.arch }}" ]; then
            case "${{ matrix.arch }}" in
              x64_x86) ARCH="x86";;
              arm64) ARCH="arm";;
              *) ARCH="${{ matrix.arch }}";;
            esac
            echo "Architecture from matrix: $ARCH"
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.arch }}"
          fi

          if [ -n "${{ matrix.qt }}" ]; then
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.qt }}"
          fi

          GENERATOR=""
          if [ -n "${{ matrix.generator }}" ]; then
            GENERATOR="-G \"${{ matrix.generator }}\""
            echo "Generator from matrix: $GENERATOR"
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.generator }}"
          fi
          echo "TDESKTOP_BUILD_GENERATOR=$GENERATOR" >> $GITHUB_ENV

          [ -n "$GENERATOR" ] && ARCH=""
          echo "TDESKTOP_BUILD_ARCH=$ARCH" >> $GITHUB_ENV

          DEFINE=""
          if [ -n "${{ matrix.defines }}" ]; then
            DEFINE="-D ${{ matrix.defines }}=ON"
            echo "Define from matrix: $DEFINE"
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.defines }}"
          fi
          echo "TDESKTOP_BUILD_DEFINE=$DEFINE" >> $GITHUB_ENV

          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV

          API="-D TDESKTOP_API_TEST=ON"
          if [ -n "${{ secrets.TDESKTOP_API_ID }}" ] && [ -n "${{ secrets.TDESKTOP_API_HASH }}" ]; then
            echo "Using provided API credentials from secrets."
            API="-D TDESKTOP_API_ID=${{ secrets.TDESKTOP_API_ID }} -D TDESKTOP_API_HASH=${{ secrets.TDESKTOP_API_HASH }}"
          elif [ $GITHUB_REF == 'refs/heads/nightly' ]; then
            echo "Use the open credentials."
            API="-D TDESKTOP_API_ID=611335 -D TDESKTOP_API_HASH=d524b414d21f4d37f08684c1df41ac9c"
          fi
          echo "TDESKTOP_BUILD_API=$API" >> $GITHUB_ENV

      - name: Build output cache.
        id: cache-build
        uses: actions/cache@v5
        with:
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}\out
          key: ${{ runner.OS }}-${{ matrix.arch }}-out-${{ env.CACHE_KEY }}-${{ matrix.qt || 'qt' }}-ninja-${{ github.run_id }}
          restore-keys: |
            ${{ runner.OS }}-${{ matrix.arch }}-out-${{ env.CACHE_KEY }}-${{ matrix.qt || 'qt' }}-ninja-

      - name: Free up some disk space.
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' ')' -type f ')' -o -empty ')' -delete

      - name: Telegram Desktop build.
        if: env.ONLY_CACHE == 'false'
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
          %TDESKTOP_BUILD_GENERATOR% ^
          %TDESKTOP_BUILD_ARCH% ^
          ${{ matrix.qt }} ^
          %TDESKTOP_BUILD_API% ^
          -D CMAKE_C_COMPILER_LAUNCHER=%SCCACHE_EXE% ^
          -D CMAKE_CXX_COMPILER_LAUNCHER=%SCCACHE_EXE% ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D CMAKE_COMPILE_WARNING_AS_ERROR=ON ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF ^
          %TDESKTOP_BUILD_DEFINE%

          findstr /C:"CMAKE_CXX_COMPILER_LAUNCHER" ..\out\CMakeCache.txt
          cmake --build ..\out --config Release --parallel

      - name: sccache stats.
        if: env.ONLY_CACHE == 'false'
        run: sccache --show-stats

      - name: Move artifact.
        if: (env.UPLOAD_ARTIFACT == 'true') || (github.ref == 'refs/heads/nightly')
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\Release
          mkdir artifact
          move %OUT%\AyuGram.exe artifact/
          move %OUT%\Updater.exe artifact/
      - uses: actions/upload-artifact@v6
        name: Upload artifact.
        if: (env.UPLOAD_ARTIFACT == 'true') || (github.ref == 'refs/heads/nightly')
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifact\
